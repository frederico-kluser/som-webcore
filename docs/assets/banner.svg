<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">SOM WebCore — single-pass inference for the web</title>
  <desc id="desc">Banner do projeto SOM WebCore: WebGPU + Wasm32, condicionais abstratas JEV, decisão local em menos de 50 ms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070c"/>
      <stop offset="0.55" stop-color="#080d18"/>
      <stop offset="1" stop-color="#0b0a18"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.85" r="0.8">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b9bb4" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- marca -->
  <g transform="translate(64,58)">
    <path d="M28 0 52 14v28L28 56 4 42V14Z" fill="none" stroke="url(#line)" stroke-width="2"/>
    <path d="M28 14 41 21.5v13L28 42 15 34.5v-13Z" fill="#22d3ee" fill-opacity="0.12" stroke="#67e8f9" stroke-width="1.2"/>
    <circle cx="28" cy="28" r="3.5" fill="#a5f3fc"/>
  </g>

  <text x="132" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3.4" fill="#67e8f9">OPEN-SOURCE · WEBGPU + WASM32</text>
  <text x="132" y="126" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.8" fill="#f8fafc">SOM <tspan fill="#a5f3fc">WebCore</tspan></text>
  <text x="134" y="166" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#cbd5e1">Inferência em passada única para Condicionais Abstratas (JEV)</text>
  <text x="134" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">local-first · offline · privado · custo marginal zero · &lt; 50 ms</text>

  <!-- pipeline -->
  <g transform="translate(64,238)">
    <rect x="0" y="0" width="1072" height="46" rx="12" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">
      <text x="82" y="28">STATE + QUESTION + OPTIONS</text>
      <text x="288" y="28">GEMM Q8_0 / Q4_0</text>
      <text x="470" y="28">FLASHATTENTION-2</text>
      <text x="666" y="28">SHORTCONV / GQA</text>
      <text x="850" y="28">CALIBRATION</text>
      <text x="1002" y="28">64–256 B</text>
    </g>
    <g fill="none" stroke="url(#line)" stroke-width="1.5" stroke-linecap="round">
      <path d="M186 23h30"/><path d="M352 23h28"/><path d="M548 23h24"/><path d="M748 23h22"/><path d="M918 23h26"/>
    </g>
    <g fill="#67e8f9">
      <path d="M216 23l-7-4v8z"/><path d="M380 23l-7-4v8z"/><path d="M572 23l-7-4v8z"/><path d="M770 23l-7-4v8z"/><path d="M944 23l-7-4v8z"/>
    </g>
  </g>
</svg>
