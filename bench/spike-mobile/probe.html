<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Environment probe</title>
  <style>body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; } pre { white-space: pre-wrap; font-size: 12px; }</style>
</head>
<body>
  <h1>Environment probe</h1>
  <p>Reports the browser, WebGPU (<code>navigator.gpu</code> and <code>requestAdapter()</code>) and WebAssembly support, then posts the JSON to the local server (<code>?name=&lt;result file&gt;</code>).</p>
  <pre id="out">running…</pre>
  <script type="module">
    import { probeEnvironment } from "./env.js";
    const params = new URLSearchParams(location.search);
    const report = { kind: "environment-probe", startedAt: new Date().toISOString(), page: location.href };
    try {
      report.environment = await probeEnvironment();
    } catch (error) {
      report.fatal = { name: error?.name, message: String(error?.message ?? error) };
    }
    report.finishedAt = new Date().toISOString();
    document.getElementById("out").textContent = JSON.stringify(report, null, 2);
    const name = params.get("name");
    if (name) {
      const r = await fetch(`/api/results?name=${encodeURIComponent(name)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(report, null, 2) });
      document.title = r.ok ? "posted" : "post failed";
    }
  </script>
</body>
</html>
