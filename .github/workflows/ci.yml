# =============================================================================
# CI — som-webcore (frederico-kluser/som-webcore)
#
# O job `build` é o status check exigido pelo ruleset de `main` (o `context` é o
# nome do job: não o renomeie). Ele valida o contrato de documentação, o catálogo
# de modelos e as mensagens de commit, e só passa se os jobs de código passarem:
#
#   code    lint (ESLint + tsc) e testes unitários em Node, em Linux, macOS e Windows;
#   webgpu  paridade WebGPU no Dawn sobre um adaptador de software (lavapipe, Vulkan
#           na CPU) e validação de todo WGSL pelo Tint — sem adaptador, falha.
#
# Actions fixadas por SHA. Se atualizar uma action, troque o SHA e o comentário
# (bash C:/Users/kluse/.dsh/skills/opensource-project/scripts/oss-pin-actions.sh).
# =============================================================================

name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

# Privilégio mínimo: o CI só precisa de ler o repositório.
permissions:
  contents: read

# Evita corridas duplicadas no mesmo PR/ramo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: code (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node (versão do .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Node, CPU)
        run: npm test

  webgpu:
    name: webgpu (software adapter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOM_REQUIRE_WEBGPU: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node (versão do .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Vulkan on the CPU (lavapipe)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1

      - name: Install (lockfile)
        run: npm ci

      - name: WGSL validation (Tint)
        run: npm run validate:wgsl

      - name: WebGPU parity (Dawn)
        run: npm run test:webgpu

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [code, webgpu]
    # Roda mesmo se um job de código falhar: um check obrigatório "skipped" contaria como verde.
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 25

      - name: Documentation contract
        run: python3 scripts/check-docs.py

      - name: Model catalog
        run: |
          python3 tools/fetch_model.py --check
          python3 -m unittest discover -s tests/tools -v

      - name: Conventional commits (last 25)
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          header = re.compile(
              r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
              r"(\([^)]*\))?!?: .+"
          )
          skip = re.compile(r'^(Merge |Revert "|Reapply "|Initial commit$|fixup!|squash!)')
          out = subprocess.run(
              ["git", "log", "--pretty=tformat:%s", "-n", "25", "HEAD"],
              capture_output=True,
              text=True,
              check=False,
          ).stdout
          bad = 0
          for subject in out.splitlines():
              subject = subject.strip()
              if not subject or skip.match(subject):
                  continue
              normalized = re.sub(r"\s+\(#\d+\)$", "", subject)
              if not header.match(normalized) or len(normalized) > 72:
                  print("ERRO: mensagem fora de Conventional Commits:", subject)
                  bad = 1
              else:
                  print("OK  :", subject)
          sys.exit(bad)
          PY

      - name: Code jobs (lint, tests, WebGPU, WGSL)
        env:
          CODE: ${{ needs.code.result }}
          WEBGPU: ${{ needs.webgpu.result }}
        run: |
          echo "code: $CODE · webgpu: $WEBGPU"
          if [ "$CODE" != "success" ] || [ "$WEBGPU" != "success" ]; then
            echo "Erro: um job de código não passou — Solução: veja os jobs code e webgpu deste run."
            exit 1
          fi
